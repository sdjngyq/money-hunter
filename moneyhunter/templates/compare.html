<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多项目对比 · GitHub 赚钱项目雷达</title>
<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
</head>
<body>
<header class="topbar">
  <a class="back" href="/">← 返回榜单</a>
  <span class="brand">🎯 GitHub 赚钱项目雷达</span>
  <span class="ver">v{{ version }}</span>
</header>

<main class="page">
  <section class="card" id="chartCard">
    <div class="card-head">
      <h2>多项目对比</h2>
      <span class="sub" style="color:var(--muted);font-size:12px" id="countText"></span>
      <div class="ranges" id="ranges">
        <button data-days="30">30 天</button>
        <button data-days="90">90 天</button>
        <button data-days="0" class="active">全部</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap">
      <svg id="chart"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="chart-note" id="note"></div>
    <div style="margin-top:12px">
      <label style="color:var(--muted);font-size:12.5px;cursor:pointer">
        <input type="checkbox" id="norm"> 相对增长（把每个项目起点都换算成 100）
      </label>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>数据对比</h2></div>
    <table class="data" id="table">
      <thead>
        <tr>
          <th>项目</th>
          <th>语言</th>
          <th class="num">当前 Star</th>
          <th class="num">区间增长</th>
          <th class="num">涨幅</th>
          <th class="num">变现分</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer class="page-foot">
  GitHub 赚钱项目雷达 v{{ version }} · 对比数据来自本地快照 · 相对增长以区间内最早一次快照为起点
</footer>

<script src="{{ url_for('static', filename='chart.js') }}"></script>
<script>
const IDS = {{ ids|tojson }};
const COLORS = GHChart.COLORS;
const tooltip = document.getElementById("tooltip");
const svg = document.getElementById("chart");
let days = 0;
let normalized = false;
let DATA = [];

function signed(n) {
  const v = Number(n) || 0;
  return (v >= 0 ? "+" : "") + v.toLocaleString("en-US");
}

function syncStorage() {
  localStorage.setItem("ghmh_compare", JSON.stringify(IDS));
}

function removeId(id) {
  const next = IDS.filter((x) => x !== id);
  localStorage.setItem("ghmh_compare", JSON.stringify(next));
  location.href = next.length ? "/compare?ids=" + next.join(",") : "/";
}

function renderLegend() {
  const box = document.getElementById("legend");
  if (!DATA.length) { box.innerHTML = ""; return; }
  box.innerHTML = DATA.map((repo, idx) => {
    const color = COLORS[idx % COLORS.length];
    const up = repo.growth >= 0 ? "g" : "g neg";
    return `<span class="item">
      <span class="dot" style="background:${color}"></span>
      <a href="/repo/${repo.id}" style="color:inherit">${GHChart.esc(repo.full_name)}</a>
      <span class="${up}">${signed(repo.growth)}（${signed(repo.growth_pct)}%）</span>
      <button class="rm" data-id="${repo.id}" title="移除">✕</button>
    </span>`;
  }).join("") + `<button class="btn ghost" id="clearAll" style="padding:2px 10px;font-size:12px">清空对比</button>`;

  box.querySelectorAll(".rm").forEach((btn) => {
    btn.addEventListener("click", () => removeId(Number(btn.dataset.id)));
  });
  const clear = document.getElementById("clearAll");
  if (clear) clear.addEventListener("click", () => {
    localStorage.setItem("ghmh_compare", "[]");
    location.href = "/";
  });
}

function renderTable() {
  const tbody = document.querySelector("#table tbody");
  if (!DATA.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="color:var(--muted)">还没有选择项目</td></tr>`;
    return;
  }
  tbody.innerHTML = DATA.map((repo) => {
    const up = repo.growth >= 0 ? "up" : "down";
    return `<tr>
      <td><a href="/repo/${repo.id}">${GHChart.esc(repo.full_name)}</a></td>
      <td>${GHChart.esc(repo.language || "—")}</td>
      <td class="num">${GHChart.fmt(repo.stars)}</td>
      <td class="num ${up}">${signed(repo.growth)}</td>
      <td class="num ${up}">${signed(repo.growth_pct)}%</td>
      <td class="num">${repo.money_score}</td>
    </tr>`;
  }).join("");
}

function renderChart() {
  if (!DATA.length) return;
  const series = DATA.map((repo, idx) => ({
    name: repo.full_name.split("/").pop(),
    color: COLORS[idx % COLORS.length],
    points: repo.series.map((p) => ({
      x: Date.parse(p.t),
      y: normalized ? (p.v / (repo.first || 1)) * 100 : p.v,
    })),
  }));
  GHChart.draw(svg, series, {
    tooltip,
    height: 340,
    area: false,
    formatValue: normalized ? ((v) => v.toFixed(1)) : GHChart.fmt,
  });
  const total = DATA.reduce((acc, r) => acc + Math.max(0, r.growth), 0);
  document.getElementById("note").textContent =
    `${DATA.length} 个项目 · 区间合计增长 ★${GHChart.fmt(total)}` +
    (normalized ? " · 纵轴为相对指数（起点=100）" : "");
}

async function load() {
  const countText = document.getElementById("countText");
  if (!IDS.length) {
    countText.textContent = "";
    document.getElementById("legend").innerHTML = "";
    document.getElementById("table").querySelector("tbody").innerHTML =
      `<tr><td colspan="6" style="color:var(--muted)">还没有选择项目</td></tr>`;
    document.getElementById("note").textContent = "";
    GHChart.draw(svg, [], { height: 340, empty: "先在榜单里点“＋对比”，或进入项目详情页加入对比" });
    document.querySelector("#chartCard").insertAdjacentHTML(
      "beforeend",
      `<div class="empty" style="padding:30px 10px 10px">
        <div class="big">📊</div>
        <p>还没有选择对比项目</p>
        <p><a class="btn primary" href="/">去榜单挑选项目</a></p>
      </div>`
    );
    return;
  }

  syncStorage();
  const params = new URLSearchParams({ ids: IDS.join(",") });
  if (days) params.set("days", String(days));
  const resp = await fetch("/api/compare?" + params.toString());
  const body = await resp.json();
  DATA = body.repos || [];
  countText.textContent = `已选 ${DATA.length} 个`;
  renderLegend();
  renderTable();
  renderChart();
  if (!DATA.length) {
    document.getElementById("note").textContent = "所选项目暂无快照数据";
  }
}

document.getElementById("ranges").addEventListener("click", (event) => {
  const btn = event.target.closest("button[data-days]");
  if (!btn) return;
  days = Number(btn.dataset.days);
  document.querySelectorAll("#ranges button").forEach((b) => b.classList.toggle("active", b === btn));
  load();
});

document.getElementById("norm").addEventListener("change", (event) => {
  normalized = event.target.checked;
  renderChart();
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderChart, 120);
});

load();
</script>
</body>
</html>
